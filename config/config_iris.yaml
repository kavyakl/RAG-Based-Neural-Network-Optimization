dataset:
  input_features: 4
  model_path: models/original/relu/iris
  name: iris
  num_classes: 3
  path: models/original/relu/iris
  data_path: data/iris.csv
  model_dir: models/iris
  target_column: class

export:
  edge_impulse:
    enabled: true
    project_id: 669207
  enabled: true
  onnx_dir: models/onnx
  original_model_dir: models/original
  pruned_model_dir: models/pruned
  save_dir: models/pruned/relu

inference:
  batch_size: 32
  enabled: true
  output_dir: results/inference/relu

model:
  activation: relu
  hidden_neurons: 16
  input_features: 4
  model_save_path: models/iris

output:
  results_dir: results
  save_dir: models/pruned/relu

pruning:
  accuracy_drop: 0.05
  activity_threshold: 0.1
  correlation_threshold: 0.7
  enabled: true
  pruned: false
  save_dir: models/pruned/relu
  sensitivity_threshold: 0.01
  validation:
    accuracy_weight: 1.0
    batch_size: 1
    max_accuracy_drop: 0.05
    max_neurons_pruned: 6
    min_accuracy: 0.9
    require_min_neurons: 6
    size_weight: 0.0
    target_pruning_rate: 0.5
    validation_strategy: batch

training:
  batch_size: 32
  enabled: true
  epochs: 1000
  learning_rate: 0.001
  save_dir: models/original/relu 