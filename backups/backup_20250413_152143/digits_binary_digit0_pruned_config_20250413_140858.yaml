dataset:
  input_features: 64
  name: digits_binary_digit0
  num_classes: 2
  path: data/digits_binary_digit0.csv
export:
  edge_impulse:
    enabled: true
    project_id: 669207
  enabled: true
  onnx_dir: models/onnx
  original_model_dir: models/original
  pruned_model_dir: models/pruned
  save_dir: models/onnx
inference:
  batch_size: 32
  enabled: true
model:
  activation: relu
  hidden_neurons: 24
  model_save_path: models/digits_binary_digit0
output:
  results_dir: results
  save_dir: models/pruned
pruning:
  accuracy_drop: 0.05
  activity_threshold: 0.1
  correlated_neurons: &id001
  - - 3
    - 19
  - - 19
    - 20
  - - 3
    - 20
  - - 13
    - 17
  - - 2
    - 17
  - - 8
    - 14
  - - 2
    - 13
  correlation_results:
    correlated_neurons: *id001
    insensitive_neurons:
    - 14
    low_activity_neurons: []
  correlation_threshold: 0.8
  enabled: true
  final_accuracy: 100.0
  low_activity_neurons:
  - 8
  - 14
  original_hidden_neurons: 24
  pruned: false
  pruned_hidden_neurons: 22
  pruned_indices:
  - 8
  - 14
  save_dir: models/pruned
  sensitivity_threshold: 0.01
  validation:
    accuracy_weight: 1.0
    batch_size: 3
    max_accuracy_drop: 0.05
    max_neurons_pruned: 18
    min_accuracy: 0.85
    require_min_neurons: 6
    size_weight: 0.0
    validation_strategy: batch
training:
  batch_size: 32
  enabled: true
  epochs: 1000
  learning_rate: 0.001
  save_dir: models/original
