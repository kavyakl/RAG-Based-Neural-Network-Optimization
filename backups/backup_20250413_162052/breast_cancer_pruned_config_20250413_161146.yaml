dataset:
  input_features: 30
  model_path: models/breast_cancer
  name: breast_cancer
  num_classes: 2
  path: data/breast_cancer.csv
export:
  edge_impulse:
    enabled: true
    project_id: 669207
  enabled: true
  onnx_dir: models/onnx
  original_model_dir: models/original
  pruned_model_dir: models/pruned
  save_dir: models/onnx
inference:
  batch_size: 32
  enabled: true
  output_dir: results/inference
model:
  activation: relu
  hidden_neurons: 24
  model_save_path: models/breast_cancer
output:
  results_dir: results
  save_dir: models/pruned
pruning:
  accuracy_drop: 0.05
  activity_threshold: 0.1
  correlated_neurons: &id001
  - - 8
    - 10
  - - 7
    - 23
  - - 0
    - 18
  - - 7
    - 11
  - - 11
    - 23
  - - 0
    - 23
  - - 18
    - 23
  - - 11
    - 18
  - - 10
    - 13
  - - 7
    - 18
  - - 0
    - 7
  - - 0
    - 11
  - - 8
    - 13
  correlation_results:
    correlated_neurons: *id001
    insensitive_neurons:
    - 1
    - 2
    - 5
    low_activity_neurons: []
  correlation_threshold: 0.8
  enabled: true
  final_accuracy: 96.49122807017544
  low_activity_neurons:
  - 1
  - 2
  - 5
  original_hidden_neurons: 24
  pruned: false
  pruned_hidden_neurons: 21
  pruned_indices:
  - 1
  - 2
  - 5
  save_dir: models/pruned
  sensitivity_threshold: 0.01
  validation:
    accuracy_weight: 1.0
    batch_size: 3
    max_accuracy_drop: 0.05
    max_neurons_pruned: 18
    min_accuracy: 0.85
    require_min_neurons: 6
    size_weight: 0.0
    validation_strategy: batch
training:
  batch_size: 32
  enabled: true
  epochs: 1000
  learning_rate: 0.001
  save_dir: models/original
