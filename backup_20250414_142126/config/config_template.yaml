dataset:
  input_features: null  # Number of input features
  name: null  # Dataset name
  num_classes: null  # Number of output classes
  data_path: data/{dataset_name}.csv  # Path to dataset file

model:
  activation: sigmoid  # Activation function (sigmoid, tanh, relu)
  hidden_neurons: null  # Number of hidden neurons
  base_dir: models/{dataset_name}/{activation}  # Base directory for all model files
  
training:
  batch_size: 32
  enabled: true
  epochs: 1000
  learning_rate: 0.001
  save_dir: models/{dataset_name}/{activation}/original

inference:
  batch_size: 32
  enabled: true
  output_dir: results/{dataset_name}/{activation}/inference

pruning:
  enabled: true
  pruned: false
  accuracy_drop: 0.05
  activity_threshold: 0.1
  correlation_threshold: 0.8
  sensitivity_threshold: 0.01
  save_dir: models/{dataset_name}/{activation}/pruned
  validation:
    accuracy_weight: 1.0
    batch_size: 3
    max_accuracy_drop: 0.05
    max_neurons_pruned: 8
    min_accuracy: 0.85
    require_min_neurons: 6
    size_weight: 0.0
    target_pruning_rate: 0.6
    validation_strategy: batch

export:
  enabled: true
  edge_impulse:
    enabled: true
    project_id: 669207
  onnx_dir: models/{dataset_name}/{activation}/onnx

output:
  results_dir: results/{dataset_name}/{activation}
