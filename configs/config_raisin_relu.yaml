dataset:
  data_path: data/raisin.csv
  input_features: 7
  model_dir: models/raisin
  model_path: models/original/relu/raisin
  name: raisin
  num_classes: 2
  path: models/original/relu/raisin
  target_column: Class
export:
  edge_impulse:
    enabled: false
    project_id: 669207
  enabled: true
  onnx_dir: models/raisin/relu/onnx
  save_dir: models/pruned/relu/raisin
inference:
  batch_size: 32
  enabled: true
  output_dir: results/inference/relu/raisin
model:
  activation: relu
  base_dir: models/raisin/relu
  hidden_neurons: 20
  input_features: 7
  model_save_path: models/raisin
output:
  results_dir: results/raisin
  save_dir: models/pruned/relu/raisin
pruning:
  accuracy_drop: 0.05
  activity_threshold: 0.1
  correlation_threshold: 0.8
  enabled: true
  pruned: false
  save_dir: models/pruned/relu/raisin
  sensitivity_threshold: 0.01
  validation:
    accuracy_weight: 1.0
    batch_size: 3
    max_accuracy_drop: 0.05
    max_neurons_pruned: 8
    min_accuracy: 0.85
    require_min_neurons: 6
    size_weight: 0.0
    target_pruning_rate: 0.6
    validation_strategy: batch
training:
  batch_size: 32
  enabled: true
  epochs: 1000
  learning_rate: 0.001
  save_dir: models/original/relu/raisin
