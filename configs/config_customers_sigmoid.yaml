dataset:
  data_path: data/customers.csv
  input_features: 7
  model_dir: models/customers
  model_path: models/original/sigmoid/customers
  name: customers
  num_classes: 3
  path: models/original/sigmoid/customers
  target_column: Region
export:
  edge_impulse:
    enabled: false
    project_id: 669207
  enabled: true
  onnx_dir: models/customers/relu/onnx
  save_dir: models/pruned/sigmoid/customers
inference:
  batch_size: 32
  enabled: true
  output_dir: results/inference/sigmoid/customers
model:
  activation: sigmoid
  base_dir: models/customers/relu
  hidden_neurons: 20
  input_features: 7
  model_save_path: models/customers
output:
  results_dir: results/customers
  save_dir: models/pruned/sigmoid/customers
pruning:
  accuracy_drop: 0.05
  activity_threshold: 0.1
  correlation_threshold: 0.8
  enabled: true
  pruned: false
  save_dir: models/pruned/sigmoid/customers
  sensitivity_threshold: 0.01
  validation:
    accuracy_weight: 1.0
    batch_size: 3
    max_accuracy_drop: 0.05
    max_neurons_pruned: 8
    min_accuracy: 0.85
    require_min_neurons: 6
    size_weight: 0.0
    target_pruning_rate: 0.6
    validation_strategy: batch
training:
  batch_size: 32
  enabled: true
  epochs: 1000
  learning_rate: 0.001
  save_dir: models/original/sigmoid/customers
